aid: alodokter
name: Alodokter
description: >-
  Alodokter is Indonesia's leading digital health and telemedicine platform,
  founded in 2014 and operated by PT Alodokter Teknologi Solusi. It connects tens
  of millions of monthly active users with tens of thousands of licensed doctors
  through chat-based consultations (Tanya Dokter), online and in-person doctor
  appointment booking, a large library of medically reviewed health articles and
  a symptom and disease encyclopedia, health protection and insurance products, and
  a health commerce surface for medicines and health products. This API Evangelist
  profile was surfaced as a portfolio company of 500 Global and enriched from the
  provider's own public web surface; Alodokter does not publish a public developer
  API portal or OpenAPI at this time, so this profile focuses on company identity,
  legal and support surfaces, and domain security posture.
